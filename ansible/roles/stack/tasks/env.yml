---
- name: Is a cloud Mongo URL provided (then no local mongo container is used)
  ansible.builtin.stat:
    path: "{{ clover_db_url_file }}"
  register: stack_dburl_file

- name: Read the cloud Mongo URL (never printed)
  ansible.builtin.slurp:
    src: "{{ clover_db_url_file }}"
  register: stack_dburl
  when: stack_dburl_file.stat.exists
  no_log: true

- name: Which Mongo clover-node uses
  ansible.builtin.set_fact:
    stack_external_mongo: "{{ stack_dburl_file.stat.exists }}"

- name: Are the secret env files already there (a rerun keeps them)
  ansible.builtin.stat:
    path: "{{ stack_dir }}/infra.env"
  register: stack_envfile

- name: Make new secrets, only on the first run. They are written to the env files and nowhere else.
  ansible.builtin.set_fact:
    stack_pg_password: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    stack_rabbit_password: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    stack_mongo_password: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    stack_django_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"
    stack_clover_token_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=ascii_letters,digits') }}"
  when: not stack_envfile.stat.exists
  no_log: true

- name: Env files (created once, never overwritten, mode 0600)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ stack_dir }}/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
    force: false
  loop: "{{ ['infra.env', 'omnisync.env', 'clover.env'] + ([] if stack_external_mongo else ['mongo.env']) }}"
  when: not stack_envfile.stat.exists
  no_log: true

- name: Read back the local Mongo password (kept from the first run)
  ansible.builtin.slurp:
    src: "{{ stack_dir }}/mongo.env"
  register: stack_mongo_env
  when: not stack_external_mongo
  no_log: true

- name: Local Mongo password, read back from its env file (kept from the first run)
  ansible.builtin.set_fact:
    stack_mongo_pw_kept: >-
      {{ (stack_mongo_env.content | b64decode).splitlines()
      | select('match', 'MONGO_INITDB_ROOT_PASSWORD=') | first | regex_replace('^[^=]*=', '') | trim }}
  when: not stack_external_mongo
  no_log: true

- name: Which database URL clover-node gets
  ansible.builtin.set_fact:
    stack_clover_db_url: >-
      {{ (stack_dburl.content | b64decode | trim) if stack_external_mongo
      else 'mongodb://cloveradmin:' ~ stack_mongo_pw_kept ~ '@mongo:27017/clover?authSource=admin' }}
  no_log: true

- name: Connection env file for clover-node (re-rendered every run, mode 0600)
  ansible.builtin.template:
    src: clover-conn.env.j2
    dest: "{{ stack_dir }}/clover-conn.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true

# odoosync-deploy refuses to deploy clover-node unless it can read CLOVER_DEPLOY_ENV (and the production Atlas host guard) from a
# ROOT-OWNED file. This is a root-only copy of the same connection settings, kept in step on every run.
- name: Is the deploy tools' folder there
  ansible.builtin.stat:
    path: /etc/odoosync
  register: stack_etc_odoosync

- name: Root-owned copy of the clover-node connection settings for the deploy tool's guard
  ansible.builtin.template:
    src: clover-conn.env.j2
    dest: /etc/odoosync/clover.env
    owner: root
    group: root
    mode: "0600"
  when: stack_etc_odoosync.stat.exists
  no_log: true
