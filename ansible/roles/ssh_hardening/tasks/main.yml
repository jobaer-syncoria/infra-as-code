---
# Lock-out safety: roles/deploy_user already refused to go on without a key for the deploy user.
- name: Back up the current drop-in folder listing (for the record)
  ansible.builtin.shell: "ls -1 /etc/ssh/sshd_config.d > /root/sshd_config.d.listing.$(date +%Y%m%d)"
  args: {creates: "/root/sshd_config.d.listing.{{ ansible_facts['date_time']['date'] | replace('-', '') }}"}
  changed_when: false

- name: Harden sshd, and undo at once if sshd does not accept or apply it
  block:
    - name: Write the drop-in
      ansible.builtin.template:
        src: 00-hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: "0644"
      register: ssh_hardening_dropin
    - name: Check that sshd accepts the whole configuration
      ansible.builtin.command: sshd -t
      changed_when: false
    - name: Reload sshd (reload, never restart, so open sessions stay)  # noqa: no-handler
      ansible.builtin.service: {name: ssh, state: reloaded}
      when: ssh_hardening_dropin.changed
    - name: What sshd really uses now
      ansible.builtin.command: sshd -T
      register: ssh_hardening_effective
      changed_when: false
      when: not ansible_check_mode
    - name: Passwords off and root login as asked
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_hardening_effective.stdout"
          - "('permitrootlogin ' ~ ssh_permit_root_login) in ssh_hardening_effective.stdout"
          - "'pubkeyauthentication yes' in ssh_hardening_effective.stdout"
  rescue:
    - name: Something is off, so remove the drop-in again
      ansible.builtin.file: {path: /etc/ssh/sshd_config.d/00-hardening.conf, state: absent}
    - name: Reload sshd with the old settings
      ansible.builtin.service: {name: ssh, state: reloaded}
    - name: Stop here
      ansible.builtin.fail:
        msg: "SSH hardening was rolled back because sshd rejected it or uses other values. Read the error above."
