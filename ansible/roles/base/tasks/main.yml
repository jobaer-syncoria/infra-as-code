---
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Unattended security upgrades on
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Timezone UTC
  community.general.timezone:
    name: Etc/UTC

- name: Is the swap file there
  ansible.builtin.stat:
    path: /swapfile
  register: base_swapfile

- name: Create the swap file (image builds need the memory)
  when: not base_swapfile.stat.exists
  block:
    - name: Allocate it
      ansible.builtin.command: "fallocate -l {{ swap_size }} /swapfile"
      changed_when: true
    - name: Lock its permissions
      ansible.builtin.file: {path: /swapfile, owner: root, group: root, mode: "0600"}
    - name: Format it
      ansible.builtin.command: mkswap /swapfile
      changed_when: true

- name: Mount the swap file now and at boot
  ansible.posix.mount:
    src: /swapfile
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Turn swap on if it is not
  ansible.builtin.shell: |
    set -o pipefail
    swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile
  args:
    executable: /bin/bash
  changed_when: false

- name: The journald drop-in folder (a fresh image does not have it)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap the systemd journal so logs cannot fill the disk (odoosync-verify host checks it; the size is an assumption)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-odoosync-cap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=500M
  notify: Restart journald
