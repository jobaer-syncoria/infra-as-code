---
- name: UFW default deny incoming
  community.general.ufw: {default: deny, direction: incoming}
- name: UFW default allow outgoing
  community.general.ufw: {default: allow, direction: outgoing}
- name: Allow the public ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ ufw_allow_tcp + ([clover_ui_port] if expose_clover_ui else []) }}"
- name: UFW on
  community.general.ufw: {state: enabled}
