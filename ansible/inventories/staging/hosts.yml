# Default: Ansible runs ON the staging server itself (connection local), as root, right after a DigitalOcean rebuild.
# To run it from another machine instead, replace `ansible_connection: local` with
#   ansible_host: <droplet ip>   ansible_user: root   (first run)   or   syncoria-dev   (later runs)
all:
  children:
    staging:
      hosts:
        odoosync-stg-01:
          ansible_connection: local
